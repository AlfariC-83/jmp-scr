<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        #boo {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: none;
        }

        #start {
            position: fixed;
            inset: 0;
            background: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div id="start">continue. . .</div>

    <img id="boo" src="boo.png" alt="">

    <audio id="sound" src="boo.mp3"></audio>

    <script>
        const start = document.getElementById("start");
        const boo = document.getElementById("boo");
        const sound = document.getElementById("sound");

        start.addEventListener("click", async () => {

            // enter fullscreen
            try {
                await document.documentElement.requestFullscreen();
            } catch (e) {
                console.log("failed to fullscreen:", e);
            }

            // show image
            start.style.display = "none";
            boo.style.display = "block";

            // play audio
            sound.currentTime = 0;
            sound.play().catch(e => {
                console.log("Audio gagal diputar:", e);
            });
        });
    </script>

</body>
</html>
